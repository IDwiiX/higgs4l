# Samples and cuts of the official ATLAS notebook HZZAnalysis.ipynb (2025e-13tev-beta).
release: 2025e-13tev-beta
skim: exactly4lep
lumi_fb: 36.6

samples:
  data: [data]
  signal: [345060, 346228, 346310, 346311, 346312, 346340, 346341, 346342]
  zz: [700600]
  other_bkg: [410470, 410155, 410218, 410219, 412043, 364243, 364242, 364246, 364248,
              700320, 700321, 700322, 700323, 700324, 700325]

# The notebook's stored outputs (P1-a, P1-d) predate commit eae7616, which added 346310.
notebook_outputs_signal: [345060, 346228, 346311, 346312, 346340, 346341, 346342]

notebook_selection:
  lep_pt_min: [20, 15, 10]
  lep_type_sums: [44, 48, 52]
  electron: {id: lep_isLooseID, iso: lep_isLooseIso}
  muon: {id: lep_isMediumID, iso: lep_isLooseIso}

# Corrected selection: same lepton cuts with pT thresholds on pT-sorted leptons, then Z pairing.
paired_selection:
  mz: 91.1876
  m12: [50, 106]
  m34_min: 12

histogram:
  m4l_min: 80
  m4l_max: 250
  bin_width: 2.5
  notebook_window: [122.5, 130.0]

# Phase 2 mass fit. Shapes come from simulation only; the signal shape and calibration
# use even eventNumber, leaving the odd half for the check on simulation (P2-b).
mass_fit:
  range: [110, 140]
  m_true: 125.0
  signal_shape_dids: [345060, 346228]  # H -> ZZ* -> 4l (ggH, VBF)
  background_shape_dids: [700600]  # ZZ*
  n_toys: 2000
  seed: 20251023
